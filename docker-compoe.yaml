version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    environment:
      - REACT_APP_API_URL=http://backend:5000
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/tododb
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data:

